<!doctype html>
<html lang="ru" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#75143b" />
    <meta
      name="description"
      content="hp3000 — каталог анкет по району и бюджету."
    />
    <title>hp3000</title>
    <script>
      // Тема до первой отрисовки, чтобы не было вспышки светлого фона.
      try {
        var stored = localStorage.getItem('hp3k-theme')
        var dark =
          (stored && JSON.parse(stored).state?.theme === 'dark') ||
          (!stored && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
