# Конфиг продакшена: раздача SPA и прокси на локальный API.
# Куда кладём: /etc/nginx/sites-available/hp3k + симлинк в sites-enabled,
# заголовки в /etc/nginx/snippets/hp3k-headers.conf, зона лимитера в conf.d.
# Пути рассчитаны на /srv/hp3000 — правь, если деплой в другом каталоге.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/hp3000/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 3m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req zone=hp3k burst=20 nodelay;
        include snippets/hp3k-headers.conf;
    }

    # загруженные фото
    location /uploads/ {
        alias /srv/hp3000/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        include snippets/hp3k-headers.conf;
        try_files $uri =404;
    }

    # хэшированные бандлы
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/hp3k-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/hp3k-headers.conf;
    }

    # SPA: остальное отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
        include snippets/hp3k-headers.conf;
    }
}

# Заголовки дублируются в каждом location намеренно: nginx не наследует
# add_header на уровень ниже, если в location есть свои add_header.
#
# В /etc/nginx/conf.d/hp3k-limits.conf:
#   limit_req_zone $binary_remote_addr zone=hp3k:10m rate=15r/s;
