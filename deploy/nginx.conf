server {
    listen 80;
    server_name hookerspro.local;

    root /srv/hookerspro/dist;
    index index.html;

    # сжатие статики
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: любые маршруты отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # долгий кэш для хэшированных бандлов
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # короткий кэш для картинок-заглушек
    location ~* \.(svg|png|jpg|webp)$ {
        expires 7d;
        try_files $uri =404;
    }

    # API — прокси на локальный мок (:8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # лимиты: тела запросов и частоты
        client_max_body_size 2m;
        limit_req zone=api burst=20 nodelay;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options deny;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

# лимитер вынести в http-контекст (conf.d/limits.conf):
# limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
